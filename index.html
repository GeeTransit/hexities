<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
    <title>hexities</title>
  </head>

  <body>
    <form id="chat" action="javascript:void 0">
      <label for="input">message:</label>
      <input id="input"></input>
      <button type="submit">send</button>
    </form>
    <p>last location:
      <span id="location">none</span>
    </p>
    <form id="locations" action="javascript:void 0">
      show locations:
      <input id="kind-nodes" type="checkbox" name="kind" value="nodes" />
      <label for="kind-nodes">nodes</label>
      <input id="kind-edges" type="checkbox" name="kind" value="edges" />
      <label for="kind-edges">edges</label>
      <input id="kind-tiles" type="checkbox" name="kind" value="tiles" />
      <label for="kind-tiles">tiles</label>
    </form>
    <svg id="svg"></svg>
    <ul id="messages"></ul>

    <script>
      function coordKind(q, r) {
        if (q%2 === 0 && r%2 === 0)
          if ((q-r)%6 === 0)
              return "tile";
          else
              return "node";
        else if ((q-r)%3 == 0)
            return "edge";
      }
      const neighbours1 = [[0, 1], [1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1]];
      const neighbours2 = [[1, 1], [2, -1], [1, -2], [-1, -1], [-2, 1], [-1, 2]];
      const toWindowScale = (a) => 16*a;
      const toWindowCoord = (q, r) => [Math.sqrt(3)*q, (q + 2*r)].map(toWindowScale);
      const backendUrl = prompt && prompt("Server WebSocket URL");
      const defaultUrl = (
        (location.protocol == "https:" ? "wss:" : "ws:") + "//" + location.host
        + location.pathname.replace(/\/[^\/]*/, "/ws")
      );
      const $ = (name) => document.getElementById(name);
      const el = document.createElement("li");
      el.textContent = `info: connecting to ${backendUrl || defaultUrl}`;
      $("messages").prepend(el);
      const socket = new WebSocket(backendUrl || defaultUrl);
      socket.addEventListener("open", () => {
        const el = document.createElement("li");
        el.textContent = "info: connection opened";
        $("messages").prepend(el);
      });
      const onChangeLocations = (event) => {
        let kinds = [];
        for (const input of $("locations").elements)
          if (input.checked)
            if (event && event.target == input)
              kinds.unshift(input.value)
            else
              kinds.push(input.value);
        kinds = kinds.slice(0, 1);
        for (const input of $("locations").elements) {
          input.checked = kinds.includes(input.value);
        }
        for (const g of $("svg").getElementsByClassName("locations")) {
          g.setAttribute("visibility", kinds.some(kind => g.classList.contains(kind)) ? "visible" : "hidden");
        }
      };
      onChangeLocations();
      $("locations").addEventListener("change", onChangeLocations);
      $("chat").addEventListener("submit", () => {
        socket.send($("input").value);
      });
      socket.addEventListener("message", event => {
        const el = document.createElement("li");
        el.textContent = event.data;
        $("messages").prepend(el);
        const ev = JSON.parse(event.data);
        if (ev.state != null) {
          const state = ev.state;
          const sortByWindowCoord = (fY) => (a, b) => {
            const [ax, ay] = toWindowCoord(a.x, a.y);
            const [bx, by] = toWindowCoord(b.x, b.y);
            return fY(ay) - fY(by) || ax - bx;
          };
          state.tiles.sort(sortByWindowCoord(y => y));
          state.edges.sort(sortByWindowCoord(y => y));
          state.nodes.sort(sortByWindowCoord(y => Math.floor(y/toWindowScale(6))));
          const svg = $("svg");
          // see https://stackoverflow.com/questions/4991098/replacing-all-children-of-an-htmlelement
          svg.replaceChildren();
          const makeGroup = (parent, ...kinds) => {
            const el = document.createElementNS("http://www.w3.org/2000/svg", "g");
            el.classList.add(...kinds);
            parent.appendChild(el);
            return el;
          };
          const tilesG = makeGroup(svg, "tiles");
          const edgesG = makeGroup(svg, "edges");
          const nodesG = makeGroup(svg, "nodes");
          const tilesLocationsG = makeGroup(svg, "locations", "tiles");
          const edgesLocationsG = makeGroup(svg, "locations", "edges");
          const nodesLocationsG = makeGroup(svg, "locations", "nodes");
          for (const tile of state.tiles) {
            const { x, y, resource, number } = tile;
            {
              const [xx, yy] = toWindowCoord(x, y);
              const el = document.createElementNS("http://www.w3.org/2000/svg", "circle");
              el.setAttribute("cx", xx);
              el.setAttribute("cy", yy);
              el.setAttribute("r", toWindowScale(2));
              el.setAttribute("fill-opacity", 0);
              el.setAttribute("stroke", "black");
              el.setAttribute("stroke-width", toWindowScale(0.4));
              el.setAttribute("tabindex", 0);
              el.addEventListener("focus", () => {
                $("location").textContent = `${x}, ${y}`;
              });
              el.appendChild((() => {
                const el = document.createElementNS("http://www.w3.org/2000/svg", "title");
                el.textContent = `${x},${y}`;
                return el;
              })());
              tilesLocationsG.appendChild(el);
            }
            const g = makeGroup(tilesG);
            const coords = [];
            for (const [dx, dy] of neighbours1) {
              coords.push(toWindowCoord(x + 2*dx, y + 2*dy));
            }
            // see https://stackoverflow.com/questions/16488884/add-svg-element-to-existing-svg-using-dom
            const el = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
            el.setAttribute("points", coords.join(" "));
            el.setAttribute("fill", {
              brick: "salmon",
              ore: "lightgray",
              sheep: "yellowgreen",
              wheat: "gold",
              wood: "mediumseagreen",
              desert: "wheat",
            }[resource] ?? "magenta");
            el.appendChild((() => {
              const el = document.createElementNS("http://www.w3.org/2000/svg", "title");
              el.textContent = `${resource} ${number ?? ""}`.trim();
              return el;
            })())
            g.appendChild(el);
            if (number != null) {
              {
                const [xx, yy] = toWindowCoord(x, y);
                const el = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                el.setAttribute("cx", xx);
                el.setAttribute("cy", yy);
                el.setAttribute("r", toWindowScale(1.6));
                el.setAttribute("fill", "moccasin");
                el.setAttribute("style", "pointer-events: none");
                g.appendChild(el);
              }
              const el = document.createElementNS("http://www.w3.org/2000/svg", "text");
              const [xx, yy] = toWindowCoord(x, y);
              const fill = [6, 8].includes(number) ? "crimson" : "black";
              el.setAttribute("x", xx);
              el.setAttribute("y", yy);
              el.setAttribute("fill", fill);
              el.setAttribute("style", "pointer-events: none");
              el.setAttribute("font-size", toWindowScale(2));
              // see https://stackoverflow.com/questions/5546346/how-to-place-and-center-text-in-an-svg-rectangle
              el.setAttribute("text-anchor", "middle");
              el.setAttribute("dominant-baseline", "middle");
              el.textContent = number;
              g.appendChild(el);
              {
                const [x1, y1] = toWindowCoord(x+1, y);
                const [x2, y2] = toWindowCoord(x-1, y+1);
                const [xx, yy] = [(x1+x2)/2, (y1+y2)/2];
                const pips = 6 - Math.abs(7-number);
                for (let i = 0; i < pips; i++) {
                  const el = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                  el.setAttribute("cx", xx - toWindowScale(0.2)*(pips-1) + toWindowScale(0.4)*i);
                  el.setAttribute("cy", yy);
                  el.setAttribute("r", toWindowScale(0.15));
                  el.setAttribute("fill", fill);
                  el.setAttribute("style", "pointer-events: none");
                  g.appendChild(el);
                }
              }
            }
          }
          for (const edge of state.edges) {
            const { x, y } = edge;
            {
              const [xx, yy] = toWindowCoord(x, y);
              const el = document.createElementNS("http://www.w3.org/2000/svg", "circle");
              el.setAttribute("cx", xx);
              el.setAttribute("cy", yy);
              el.setAttribute("r", toWindowScale(0.7));
              el.setAttribute("fill-opacity", 0);
              el.setAttribute("stroke", "black");
              el.setAttribute("stroke-width", toWindowScale(0.1));
              el.setAttribute("tabindex", 0);
              el.addEventListener("focus", () => {
                $("location").textContent = `${x}, ${y}`;
              });
              el.appendChild((() => {
                const el = document.createElementNS("http://www.w3.org/2000/svg", "title");
                el.textContent = `${x},${y}`;
                return el;
              })());
              edgesLocationsG.appendChild(el);
            }
            const g = makeGroup(edgesG);
            const coords = [];
            for (const [dx, dy] of neighbours1) {
              const [nx, ny] = [x + dx, y + dy];
              if (coordKind(nx, ny) === "node") {
                coords.push(toWindowCoord(nx, ny));
              }
            }
            const el = document.createElementNS("http://www.w3.org/2000/svg", "line");
            const [[x1, y1], [x2, y2]] = coords;
            el.setAttribute("x1", x1);
            el.setAttribute("y1", y1);
            el.setAttribute("x2", x2);
            el.setAttribute("y2", y2);
            el.setAttribute("stroke", "gray");
            el.setAttribute("stroke-width", toWindowScale(0.25));
            el.appendChild((() => {
              const el = document.createElementNS("http://www.w3.org/2000/svg", "title");
              el.textContent = `${x},${y}`;
              return el;
            })())
            g.appendChild(el);
          }
          for (const node of state.nodes) {
            const { x, y } = node;
            const [cx, cy] = toWindowCoord(x, y);
            const el = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            el.setAttribute("cx", cx);
            el.setAttribute("cy", cy);
            el.setAttribute("r", toWindowScale(1));
            el.setAttribute("fill-opacity", 0);
            el.setAttribute("stroke", "black");
            el.setAttribute("stroke-width", toWindowScale(0.2));
            el.setAttribute("tabindex", 0);
            el.addEventListener("focus", () => {
              $("location").textContent = `${x}, ${y}`;
            });
            el.appendChild((() => {
              const el = document.createElementNS("http://www.w3.org/2000/svg", "title");
              el.textContent = `${x},${y}`;
              return el;
            })())
            nodesLocationsG.appendChild(el);
          }
          // see https://stackoverflow.com/questions/14362656/autosize-an-svg
          const bbox = svg.getBBox();
          const scale = 1;
          const padding = 0.5;
          svg.setAttribute("width", (bbox.width + toWindowScale(padding*2))*scale/toWindowScale(1) + "rem");
          svg.setAttribute("height", (bbox.height + toWindowScale(padding*2))*scale/toWindowScale(1) + "rem");
          svg.setAttribute("viewBox", `${bbox.x - toWindowScale(0.5)} ${bbox.y - toWindowScale(0.5)} ${bbox.width + toWindowScale(1)} ${bbox.height + toWindowScale(1)}`);
          onChangeLocations();
        }
      });
      socket.addEventListener("close", () => {
        const el = document.createElement("li");
        el.textContent = "error: connection closed";
        $("messages").prepend(el);
      });
    </script>
  </body>
</html>
